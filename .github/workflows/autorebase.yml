name: Rebase Outdated PRs

on:
  push:
    branches:
      - '**'

jobs:
  rebase-outdated-prs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Rebase PRs that are truly behind
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              const targetBranch = context.ref.replace('refs/heads/', '');
              const { execSync, spawnSync } = require('child_process');

              const { data: prs } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                base: targetBranch
              });

              console.log(`Found ${prs.length} PR(s) targeting ${targetBranch}`);

              for (const pr of prs) {
                console.log(`Checking PR #${pr.number}...`);

                execSync(`git fetch origin ${targetBranch}`, { stdio: 'inherit' });
                execSync(`git fetch origin pull/${pr.number}/head:pr-${pr.number}`, { stdio: 'inherit' });

                const baseCommit = execSync(`git rev-parse origin/${targetBranch}`).toString().trim();
                const prCommit = execSync(`git rev-parse pr-${pr.number}`).toString().trim();

                const result = spawnSync('git', ['merge-base', '--is-ancestor', baseCommit, prCommit]);
                const isBehind = result.status !== 0;

                if (!isBehind) {
                  console.log(`PR #${pr.number} is already based on latest ${targetBranch}`);
                  continue;
                }

                try {
                  console.log(`Rebasing PR #${pr.number}`);
                  execSync(`git checkout pr-${pr.number}`, { stdio: 'inherit' });
                  execSync(`git rebase --signoff origin/${targetBranch}`, { stdio: 'inherit' });
                  execSync(`git push origin HEAD:${pr.head.ref} --force-with-lease`, { stdio: 'inherit' });
                } catch (err) {
                  console.log(`Failed to rebase PR #${pr.number}: ${err.message}`);
                }
              }
            } catch (err) {
              console.error("Top-level error:", err);
            }
